name: CI

# Runs on push to main as well as on pull requests, so main is verified directly
# and not only through PRs.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # test_conformance.py exercises the JSON scenarios under
      # compatibility-tests/ (tool-rename, output-schema-change,
      # subagent-handoff-change) so no separate job needed.
      - name: Run pytest
        run: python -m pytest tests/ -q

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        # Config lives in pyproject.toml ([tool.ruff.lint]) so local and CI
        # lint stay in lock-step. Lints the whole repo, tests included.
        run: ruff check .

      - name: Mypy
        # Strict type-check the package (config in pyproject [tool.mypy]).
        run: mypy agentversion/

  floors:
    # The version floors in pyproject.toml are claims; this job is what makes them
    # true. It installs the LOWEST version of every direct dependency and runs the
    # suite against it. Added 2026-08-17, after the same job on decimalai-python
    # caught a `click>=8.0` floor that was false by two minor versions.
    # Advisory until it has been green for a week, then promote to required.
    name: Floors resolve and pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - uses: astral-sh/setup-uv@v5

      - name: Install at the lowest declared versions
        run: uv pip install --system --resolution lowest-direct ".[dev]"

      - name: Show what resolved
        run: uv pip list --system

      - name: The floors are claims — run them
        run: python -m pytest tests -q

  audit:
    # Known-advisory check against the resolved dependency set. Advisory: a new
    # advisory lands on someone else's schedule and should not turn main red
    # before anyone has read it.
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package and auditor
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit .

      - name: Audit
        run: pip-audit --progress-spinner off
