# PAUSED 2026-08-12, ahead of the public flip.
#
# `open-pull-requests-limit: 0` is Dependabot's documented way to disable VERSION
# updates for an ecosystem. It is used here instead of deleting this file so that
# the config, and the traps recorded in it, survive the pause — restoring it is a
# one-character edit per ecosystem, back to 3.
#
# WHAT IS STILL ON: Dependabot security alerts and security updates. Those are a
# repository setting, not this file, so a real advisory still raises a PR. Only
# routine version bumps are paused.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0   # paused — was 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0   # paused — was 3
    ignore:
      # Skip MAJOR github-actions bumps — they churn and break
      # (actions/checkout@v7 broke docs CI). Take majors deliberately and tested;
      # minor/patch (including security) updates still auto-PR.
      #
      # `ignore` must stay nested under this entry. It is not a valid top-level key,
      # and a single unrecognised top-level key makes Dependabot reject the file as a
      # whole — silently, with no PR and no error anywhere you would look. Nothing
      # then maintains the action SHA pins in .github/workflows/publish.yml, which is
      # the job this config exists to do.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
